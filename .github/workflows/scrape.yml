name: Scrape events
on:
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  gov-exhibitions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install httpx pydantic python-dotenv supabase
    - name: Run gov open-data scraper
      working-directory: scraper
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python gov_scraper.py --limit 80
  cwa-breaker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install httpx pydantic python-dotenv supabase
    - name: Check CWA typhoon warnings
      working-directory: scraper
      env:
        CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python cwa_breaker.py
